<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shazza & Gazza — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg: #101219;
    --surface: #1c2029;
    --surface-2: #242938;
    --line: rgba(237,238,241,0.09);
    --line-strong: rgba(237,238,241,0.16);
    --text: #edeef1;
    --muted: #8b90a3;
    --gold: #f2a93b;
    --gold-dim: #a87527;
    --shazza: #ff5f96;
    --gazza: #35c9ea;
    --danger: #ff5f5f;
    --radius: 12px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
  }
  h1,h2,h3{ margin:0; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  .display{ font-family:'Bebas Neue', sans-serif; letter-spacing:0.02em; }

  /* ---- Login ---- */
  #loginScreen{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .login-card{
    width:100%; max-width:360px;
    background: var(--surface);
    border:1px solid var(--line-strong);
    border-radius: var(--radius);
    padding:28px;
  }
  .login-card h1{ font-family:'Bebas Neue', sans-serif; font-size:30px; color:var(--gold); }
  .login-card p{ color:var(--muted); font-size:13px; margin-top:6px; }
  .field{ margin-top:18px; }
  .field label{
    display:block; font-family:'JetBrains Mono', monospace; font-size:11px;
    letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); margin-bottom:7px;
  }
  input{
    width:100%; background:var(--bg); border:1px solid var(--line-strong); color:var(--text);
    border-radius:8px; padding:11px 13px; font-size:14px; font-family:inherit;
  }
  input:focus{ outline:none; border-color:var(--gold-dim); }
  select{
    width:100%; background:var(--bg); border:1px solid var(--line-strong); color:var(--text);
    border-radius:8px; padding:11px 13px; font-size:14px; font-family:inherit;
  }
  .btn{
    border:none; border-radius:8px; padding:12px 18px; font-weight:700; font-size:14px;
    cursor:pointer; transition: filter .15s ease;
  }
  .btn-primary{ background: linear-gradient(180deg,#ffcf7d,var(--gold)); color:#1b1204; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-secondary{ background: var(--surface-2); border:1px solid var(--line-strong); color:var(--text); }
  .btn-secondary:hover{ background:#2c3245; }
  .btn-danger{ background: rgba(255,95,95,0.12); border:1px solid var(--danger); color:var(--danger); }
  .btn-full{ width:100%; margin-top:22px; }
  .error-msg{ color: var(--danger); font-size:13px; margin-top:14px; display:none; }

  /* ---- App shell ---- */
  #app{ display:none; }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background: rgba(16,18,25,0.92); backdrop-filter: blur(8px); z-index:10;
  }
  header h1{ font-family:'Bebas Neue', sans-serif; font-size:24px; color:var(--gold); }
  main{ max-width:960px; margin:0 auto; padding:24px 20px 80px; }

  .tabs{ display:flex; gap:8px; margin-bottom:22px; }
  .tab-btn{
    background:var(--surface); border:1px solid var(--line-strong); color:var(--muted);
    padding:10px 18px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .tab-btn.active{ background:var(--gold); color:#1b1204; border-color:var(--gold); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .card{
    background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius);
    padding:18px; margin-bottom:14px;
  }
  .empty-note{ color:var(--muted); font-size:13px; text-align:center; padding:30px 0; }

  /* ---- Claim card ---- */
  .claim-card{ display:flex; gap:16px; flex-wrap:wrap; }
  .claim-selfie{
    width:100px; height:100px; border-radius:10px; object-fit:cover; background:var(--bg);
    flex-shrink:0; border:1px solid var(--line-strong);
  }
  .claim-info{ flex:1; min-width:200px; }
  .claim-info .row{ font-size:13px; margin-bottom:4px; }
  .claim-info .row b{ color:var(--text); }
  .badge{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .badge.shazza{ background:rgba(255,95,150,0.15); color:var(--shazza); }
  .badge.gazza{ background:rgba(53,201,234,0.15); color:var(--gazza); }
  .claim-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }

  /* ---- Photo manage card ---- */
  .photo-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap:14px; }
  .photo-card{
    background:var(--surface); border:1px solid var(--line-strong); border-radius:10px; overflow:hidden;
  }
  .photo-card img{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block; }
  .photo-card .pbody{ padding:10px; }
  .photo-card .prow{ display:flex; justify-content:space-between; align-items:center; font-size:12px; margin-bottom:8px; }
  .photo-card .pactions{ display:flex; gap:6px; }
  .photo-card .pactions button{ flex:1; font-size:11px; padding:8px 6px; }
  .inactive{ opacity:0.45; }

  .upload-card{ margin-bottom:20px; }
  .upload-row{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .upload-row .field{ margin-top:0; flex:1; min-width:150px; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>ADMIN</h1>
    <p>Shazza &amp; Gazza back office</p>
    <div class="field">
      <label for="emailInput">Email</label>
      <input type="email" id="emailInput" autocomplete="username">
    </div>
    <div class="field">
      <label for="passInput">Password</label>
      <input type="password" id="passInput" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-full" id="loginBtn">Log In</button>
    <p class="error-msg" id="loginError">Wrong email or password.</p>
  </div>
</div>

<div id="app">
  <header>
    <h1>SHAZZA &amp; GAZZA — ADMIN</h1>
    <button class="btn btn-secondary" id="logoutBtn">Log Out</button>
  </header>
  <main>
    <div class="tabs">
      <button class="tab-btn active" data-tab="claims">Claims</button>
      <button class="tab-btn" data-tab="photos">Photos</button>
    </div>

    <div class="tab-panel active" id="claimsPanel">
      <div id="claimsList"><p class="empty-note">Loading claims&hellip;</p></div>
    </div>

    <div class="tab-panel" id="photosPanel">
      <div class="card upload-card">
        <h3 style="margin-bottom:14px;">Add today's photo</h3>
        <div class="upload-row">
          <div class="field">
            <label for="photoFileInput">Image file</label>
            <input type="file" id="photoFileInput" accept="image/*">
          </div>
          <div class="field" style="max-width:160px;">
            <label for="maskTypeSelect">Hidden face is</label>
            <select id="maskTypeSelect">
              <option value="shazza">Shazza</option>
              <option value="gazza">Gazza</option>
            </select>
          </div>
          <button class="btn btn-primary" id="uploadPhotoBtn">Upload</button>
        </div>
      </div>
      <div class="photo-grid" id="photosGrid"><p class="empty-note">Loading photos&hellip;</p></div>
    </div>
  </main>
</div>

<script>
  const SUPABASE_URL = 'https://ihhktqghdsiqmsjvzcnn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_-gLigJKFMHW-OuIjOLw72w_lM0G5elo';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const loginScreen = document.getElementById('loginScreen');
  const app = document.getElementById('app');
  const loginError = document.getElementById('loginError');

  // ---- Auth ----
  document.getElementById('loginBtn').addEventListener('click', async () => {
    loginError.style.display = 'none';
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passInput').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      loginError.style.display = 'block';
      return;
    }
    showApp();
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    location.reload();
  });

  async function showApp(){
    loginScreen.style.display = 'none';
    app.style.display = 'block';
    loadClaims();
    loadPhotos();
  }

  // check if already logged in on page load
  sb.auth.getSession().then(({ data }) => {
    if(data.session) showApp();
  });

  // ---- Tabs ----
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab + 'Panel').classList.add('active');
    });
  });

  function fmtTime(iso){
    return new Date(iso).toLocaleString('en-AU', { day:'2-digit', month:'short', hour:'numeric', minute:'2-digit' });
  }

  // ---- Claims ----
  async function loadClaims(){
    const list = document.getElementById('claimsList');

    // Load all photos too, so we can show which Spotto each claim is against
    const { data: photoData, error: photoError } = await sb
      .from('photos')
      .select('*')
      .order('created_at', { ascending: true });

    const photoMap = {};
    if(!photoError && photoData){
      photoData.forEach((p, i) => {
        photoMap[p.id] = {
          num: i + 1,
          url: sb.storage.from('photos').getPublicUrl(p.image_path).data.publicUrl
        };
      });
    }

    const { data, error } = await sb
      .from('claims')
      .select('*')
      .order('created_at', { ascending: false });

    if(error){
      list.innerHTML = `<p class="empty-note">Couldn't load claims: ${error.message}</p>`;
      return;
    }
    if(!data.length){
      list.innerHTML = `<p class="empty-note">No claims yet.</p>`;
      return;
    }

    list.innerHTML = '';
    for(const claim of data){
      const { data: signed } = await sb.storage.from('selfies').createSignedUrl(claim.selfie_path, 3600);
      const selfieUrl = signed ? signed.signedUrl : '';
      const spotto = photoMap[claim.photo_id];
      const card = document.createElement('div');
      card.className = 'card claim-card';
      card.innerHTML = `
        <div style="display:flex; gap:8px; flex-shrink:0;">
          ${spotto ? `<img class="claim-selfie" src="${spotto.url}" alt="Spotto photo" loading="lazy" title="Spotto ${spotto.num}">` : `<div class="claim-selfie" style="display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center;padding:4px;">Spotto not found</div>`}
          <img class="claim-selfie" src="${selfieUrl}" alt="Selfie" loading="lazy" title="Their selfie">
        </div>
        <div class="claim-info">
          <div class="row"><b>${spotto ? 'Spotto ' + spotto.num : 'Unknown Spotto'}</b> &middot; <span class="badge ${claim.mask_type}">${claim.mask_type}</span></div>
          <div class="row">Mobile: <b>${claim.mobile_number}</b></div>
          <div class="row">Submitted: <b>${fmtTime(claim.created_at)}</b></div>
          <div class="row">Status: <b>${claim.status}</b></div>
          ${claim.status === 'pending' ? `
            <div class="claim-actions">
              <button class="btn btn-primary approve-btn" data-id="${claim.id}" data-photo="${claim.photo_id}" data-type="${claim.mask_type}">Approve</button>
              <button class="btn btn-danger reject-btn" data-id="${claim.id}">Reject</button>
            </div>` : ''}
        </div>`;
      list.appendChild(card);
    }

    list.querySelectorAll('.approve-btn').forEach(btn => {
      btn.addEventListener('click', () => approveClaim(btn.dataset.id, btn.dataset.photo));
    });
    list.querySelectorAll('.reject-btn').forEach(btn => {
      btn.addEventListener('click', () => rejectClaim(btn.dataset.id));
    });
  }

  async function approveClaim(claimId, photoId){
    if(!confirm('Approve this claim? This puts the claimed sash up on the live site.')) return;
    const now = new Date().toISOString();
    const { error: e1 } = await sb.from('claims').update({ status: 'approved' }).eq('id', claimId);
    const { error: e2 } = await sb.from('photos').update({ claimed: true, claimed_at: now }).eq('id', photoId);
    if(e1 || e2){ alert('Something went wrong approving that — try again.'); return; }
    loadClaims();
    loadPhotos();
  }

  async function rejectClaim(claimId){
    if(!confirm('Reject this claim?')) return;
    const { error } = await sb.from('claims').update({ status: 'rejected' }).eq('id', claimId);
    if(error){ alert('Something went wrong — try again.'); return; }
    loadClaims();
  }

  // ---- Photos ----
  async function loadPhotos(){
    const grid = document.getElementById('photosGrid');
    const { data, error } = await sb.from('photos').select('*').order('created_at', { ascending: false });
    if(error){
      grid.innerHTML = `<p class="empty-note">Couldn't load photos: ${error.message}</p>`;
      return;
    }
    if(!data.length){
      grid.innerHTML = `<p class="empty-note">No photos uploaded yet.</p>`;
      return;
    }
    grid.innerHTML = data.map(p => {
      const url = sb.storage.from('photos').getPublicUrl(p.image_path).data.publicUrl;
      return `
        <div class="photo-card ${p.is_active ? '' : 'inactive'}">
          <img src="${url}" alt="" loading="lazy">
          <div class="pbody">
            <div class="prow">
              <span class="badge ${p.mask_type}">${p.mask_type}</span>
              <span>${p.claimed ? 'CLAIMED' : 'OPEN'}</span>
            </div>
            <div class="pactions">
              <button class="btn btn-secondary toggle-btn" data-id="${p.id}" data-active="${p.is_active}">${p.is_active ? 'Hide' : 'Show'}</button>
              <button class="btn btn-danger delete-btn" data-id="${p.id}">Delete</button>
            </div>
          </div>
        </div>`;
    }).join('');

    grid.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const isActive = btn.dataset.active === 'true';
        await sb.from('photos').update({ is_active: !isActive }).eq('id', btn.dataset.id);
        loadPhotos();
      });
    });
    grid.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!confirm('Delete this photo permanently?')) return;
        await sb.from('photos').delete().eq('id', btn.dataset.id);
        loadPhotos();
      });
    });
  }

  document.getElementById('uploadPhotoBtn').addEventListener('click', async () => {
    const fileInput = document.getElementById('photoFileInput');
    const maskType = document.getElementById('maskTypeSelect').value;
    const file = fileInput.files[0];
    if(!file){ alert('Choose an image first.'); return; }

    const fileName = `photo-${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const { error: uploadError } = await sb.storage.from('photos').upload(fileName, file);
    if(uploadError){ alert('Upload failed: ' + uploadError.message); return; }

    const { error: insertError } = await sb.from('photos').insert({
      image_path: fileName,
      mask_type: maskType,
      claimed: false,
      is_active: true
    });
    if(insertError){ alert('Saving photo failed: ' + insertError.message); return; }

    fileInput.value = '';
    loadPhotos();
  });
</script>
</body>
</html>
